name: Build Android APK (Liquid Glass Edition)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 11 for sdkmanager
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Install Android SDK Platform 30 & Build-Tools & Remove Corrupt NDK
      run: |
        yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
        ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-30" "build-tools;29.0.3"
        rm -rf ${ANDROID_HOME}/ndk* ${ANDROID_SDK_ROOT}/ndk* /usr/local/lib/android/sdk/ndk* || true

    - name: Set up JDK 8 for Gradle build
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleNoAnalyticsDebug --stacktrace --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: 4Messages-LiquidGlass-APK
        path: presentation/build/outputs/apk/noAnalytics/debug/*.apk

    - name: Release APK
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
      with:
        tag_name: v2.6.0-stable-liquidglass
        name: "AB-SMS - Stable Liquid Glass Edition v2.6"
        body: |
          ### AB-SMS - Apple Liquid Glass Edition v2.6 (Crash Fix & Stable) 💎📱
          - **Startup Crash Fixed:** Resolved circular theme inheritance between AppTheme and AppTheme.Black, fixed decimal drawable dimension strokes, and stabilized launch sequence.
          - **App Name:** AB-SMS
          - **All-New Apple Blue & White Icon:** High-resolution icons with iOS Messages blue gradient and clean brilliant white chat symbol across all densities (mdpi to xxxhdpi) and adaptive icons.
          - **True Liquid Glass Design:** Realistic translucent glass surfaces, specular top rim gleam, delicate white glow borders, and soft slate-metallic glass background matching the user reference image.
          - **Per-Contact Cell Customization (Long-Press):** Long press on any conversation card in the main list to open a customization menu to choose custom glass color tints (iOS Blue, Emerald, Purple, Ruby, Amber, Obsidian) and adjust cell height dimensions (Compact, Standard, Comfortable, Spacious).
          - **Day & Night Mode Switch in Settings:** Direct toggle in Settings to switch between Day Glass and Night Glass themes immediately.
          - **Fixed Settings Switches & Checkmarks:** Switches now correctly display pure white knobs and vibrant Apple Blue active tracks when checked, and muted tracks when unchecked without double-coloring.
        files: presentation/build/outputs/apk/noAnalytics/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
