name: Build Android APK (Liquid Glass Edition)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 11 for sdkmanager
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Install Android SDK Platform 30 & Build-Tools & Remove Corrupt NDK
      run: |
        yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
        ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-30" "build-tools;29.0.3"
        rm -rf ${ANDROID_HOME}/ndk* ${ANDROID_SDK_ROOT}/ndk* /usr/local/lib/android/sdk/ndk* || true

    - name: Set up JDK 8 for Gradle build
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleNoAnalyticsDebug --stacktrace --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: 4Messages-LiquidGlass-APK
        path: presentation/build/outputs/apk/noAnalytics/debug/*.apk

    - name: Release APK
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
      with:
        tag_name: v2.0.0-liquid-glass
        name: "4Messages - Apple Dark Liquid Glass v2.0"
        body: |
          ### 4Messages - Apple Dark Liquid Glass v2.0 🍏💎
          - **True Obsidian Dark Glassmorphism:** Deep space dark background (#08090C) matching HorizonX aesthetic.
          - **Frosted Glass Cards:** Every conversation is housed in an elegant translucent card with subtle light border and 16dp rounded corners.
          - **Liquid Glass Searchbar & Inputs:** Frosted glass pill searchbar and compose inputs.
          - **All-New Minimalist Apple Liquid Glass Icon:** Generated high-resolution icons across all densities (mdpi to xxxhdpi) and adaptive icons.
          - **Forced Dark Glass Defaults:** The app immediately launches in the dark liquid glass theme without needing manual configuration.
          - Download the APK below and install on your Android device.
        files: presentation/build/outputs/apk/noAnalytics/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
