name: Build Android APK (Liquid Glass Edition)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 11 for sdkmanager
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Install Android SDK Platform 30 & Build-Tools & Remove Corrupt NDK
      run: |
        yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
        ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-30" "build-tools;29.0.3"
        rm -rf ${ANDROID_HOME}/ndk* ${ANDROID_SDK_ROOT}/ndk* /usr/local/lib/android/sdk/ndk* || true

    - name: Set up JDK 8 for Gradle build
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleNoAnalyticsDebug --stacktrace --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: 4Messages-LiquidGlass-APK
        path: presentation/build/outputs/apk/noAnalytics/debug/*.apk

    - name: Release APK
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
      with:
        tag_name: v2.7.0-complete
        name: "AB-SMS - Complete Edition v2.7.0 (Crash-Free, Contact Photos & Auto-Updater)"
        body: |
          ### AB-SMS - Apple Liquid Glass Edition v2.7.0 (Complete & Stable) 💎📱
          - **Default SMS App Crash Fixed:** Completely resolved the crash and freeze when granting notification permission and setting AB-SMS as default SMS app. Elimination of UI-thread blocking and thread-safe progress animation.
          - **Custom Contact Profile Pictures (Avatars):** Long-press on any conversation card now allows you to set a custom profile photo from your gallery or remove it.
          - **In-App GitHub Release Auto-Updater:** Easily check for updates directly from the side drawer or Settings. If a newer release is published on GitHub, it automatically downloads the APK with live progress and prompts installation. If already up to date, it confirms you have the latest version.
          - **App Name:** AB-SMS
          - **Apple iOS Blue & White Icon:** Vibrant Apple blue gradient background with pure white chat bubble icon across all densities and adaptive icons.
          - **Liquid Glass Visual System:** Crystal transparent card panels with specular glare, soft frosted refraction, and glowing white highlights matching the reference design.
          - **Per-Contact Cell Customization:** Long-press any contact cell to customize glass tint color (iOS Blue, Emerald, Purple, Ruby, Amber, Obsidian) and adjust cell height (Compact, Standard, Comfortable, Spacious).
          - **Day & Night Switch:** Direct toggle in Settings to switch between Day Glass and Night Glass themes.
          - **Fixed Settings Switches:** Pure white thumb with iOS blue active track.
        files: presentation/build/outputs/apk/noAnalytics/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
