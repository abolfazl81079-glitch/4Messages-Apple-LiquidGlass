name: Build Android APK (Liquid Glass Edition)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 11 for sdkmanager
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Install Android SDK Platform 30 & Build-Tools & Remove Corrupt NDK
      run: |
        yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
        ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-30" "build-tools;29.0.3"
        rm -rf ${ANDROID_HOME}/ndk* ${ANDROID_SDK_ROOT}/ndk* /usr/local/lib/android/sdk/ndk* || true

    - name: Set up JDK 8 for Gradle build
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleNoAnalyticsDebug --stacktrace --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: 4Messages-LiquidGlass-APK
        path: presentation/build/outputs/apk/noAnalytics/debug/*.apk

    - name: Release APK
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.0
        name: "AB/SMS v1.0.0 - Cyberpunk Hacker Liquid Glass Official Release"
        body: |
          # AB/SMS v1.0.0 - Professional Cyberpunk Hacker Glass Android SMS ⚡📱
          
          ### 1. Identity & Visual Direction
          - **Application Name:** AB/SMS
          - **Visual Design:** Cyberpunk + Hacker Interface + Liquid Glass + Futuristic Industrial UI
          - **Color Palette:** Deep black (#030609), Dark background (#070D14), Secondary background (#0B1622), Electric blue (#008CFF), Neon cyan (#00E5FF), Glass blue, White (#EAF6FF), Secondary text (#7892A8).
          - **Geometry:** Sharp rectangular geometry, square corners, thin electric cyan/blue neon glowing borders, layered liquid glass depth.
          - **Branding:** High-resolution launcher icons with prominent futuristic "AB/SMS" letters and animated glowing neon header.
          
          ### 2. Intelligent Number Detection & Smart Copy (CRITICAL FEATURE)
          - Deep regex & semantic parsing of message text to detect:
            * Mobile & phone numbers (Iranian 09... and international numbers)
            * 16-digit Bank Cards with local Luhn algorithm verification and Iranian bank identification
            * IBAN / Sheba (IR...)
            * One-time verification codes (OTP)
            * Postal tracking codes
          - Automatic Persian and Arabic numeral normalization (۰۱۲۳۴۵۶۷۸۹ -> 0123456789)
          - One-tap Smart Actions dialog: Copy Normalized, Copy Original, Call Number, Card Validity Check.
          
          ### 3. Advanced Delivery Reports & Two-Checkmark Status System
          - Real SMS carrier delivery reports via Android telephony APIs.
          - Custom visual status:
            * One checkmark: SMS submitted/sent
            * Two electric cyan checkmarks: Carrier delivery report confirmed
            * Clock icon: Pending / in delayed sending queue
            * Warning icon: Sending failed (tap to retry)
          
          ### 4. Delayed Sending & Scheduled SMS
          - Configurable delay before sending (1s, 2s, 3s, 5s, 10s, 15s, 30s) with live countdown progress bar and instant "Cancel Sending" button.
          - Full Scheduled SMS support for future dates and times.
          
          ### 5. Persian & English Full Support
          - Full Persian RTL layout and English LTR layout.
          - Built-in Jalali (Shamsi) Persian Calendar engine with Persian digits and month names.
          
          ### 6. Contact Customization & 9 Built-in Cyber Themes
          - Custom contact profile photos from gallery or removal.
          - 9 Built-in Cyber Themes: AB Cyber Blue, Blackout, Neon Matrix, Arctic Glass, Ghost Protocol, Deep Ocean, Crimson Hacker, Quantum, Minimal Glass.
          
          ### 7. In-App GitHub Auto-Updater
          - In-app check for updates via GitHub Releases API, live download progress, and FileProvider installation.
        files: presentation/build/outputs/apk/noAnalytics/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
